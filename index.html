<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Merci 💙</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  font-family: 'Segoe UI', sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* card */
.card {
  background: rgba(255,255,255,0.08);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  animation: fadeIn 2s ease;
}

h1 {
  font-size: 2.5em;
  margin-bottom: 20px;
}

p {
  font-size: 1.2em;
  opacity: 0.8;
  margin-bottom: 30px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: #00c6ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* animation */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(30px);}
  to {opacity: 1; transform: translateY(0);}
}

/* floating circles */
.circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  animation: float 10s infinite linear;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>

</head>

<body>

<div class="card">
  <h1>Merci pour tout 💙</h1>
  <p>
    Juste un petit message pour dire merci pour tout ce que vous faites.  
    Votre soutien compte beaucoup pour moi 🙏
  </p>
  <button onclick="showMessage()">Cliquez ici</button>
</div>

<script>
function showMessage() {
  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;font-size:2em;">
      💙 Respect et reconnaissance infinie 🙏
    </div>
  `;
}

// create floating circles
for (let i = 0; i < 20; i++) {
  let c = document.createElement("div");
  c.classList.add("circle");
  c.style.width = c.style.height = Math.random()*80 + "px";
  c.style.left = Math.random()*100 + "vw";
  c.style.animationDuration = (5 + Math.random()*10) + "s";
  document.body.appendChild(c);
}
</script>

</body>
</html>
