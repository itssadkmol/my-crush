<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For someone special 💙</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
  color: white;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* center */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* typing effect */
#text {
  font-size: 2.5em;
  border-right: 3px solid white;
  white-space: nowrap;
  overflow: hidden;
  width: 0;
  animation: typing 4s steps(40) forwards, blink .7s infinite;
}

@keyframes typing {
  to { width: 100%; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

/* buttons */
.buttons {
  margin-top: 40px;
  opacity: 0;
  transition: 1s;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}

#yes {
  background: linear-gradient(45deg, #00ffcc, #00c3ff);
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #ff4b5c;
  position: relative;
}

/* particles */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}
</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1 id="text">I didn’t want this to be just streaks... 💙</h1>

  <div class="buttons" id="btns">
    <button id="yes" onclick="yesClick()">YES 😍</button>
    <button id="no" onmouseover="moveButton()">NO 😅</button>
  </div>
</div>

<script>
// typing show buttons
setTimeout(() => {
  document.getElementById("btns").style.opacity = 1;
}, 4500);

// NO button moves
function moveButton() {
  const btn = document.getElementById("no");
  btn.style.position = "absolute";
  btn.style.left = Math.random() * window.innerWidth + "px";
  btn.style.top = Math.random() * window.innerHeight + "px";
}

// YES click
function yesClick() {
  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-size:3em;">
      💙 You just made my day 😍
    </div>
  `;
}

// particles background
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    dx: (Math.random() - 0.5),
    dy: (Math.random() - 0.5)
  });
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
